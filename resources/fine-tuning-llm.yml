# yaml-language-server: $schema=../../bundle_config_schema.json
common: &common
  tags:
    project: ft-llm
    environment: ${bundle.target}

resources:
  jobs:
    FineTuning_Pipeline:
      name: FineTuning Pipeline
      tasks:
        - task_key: Data_Processing
          notebook_task:
            notebook_path: ../notebooks/01 - Data Processing.py
            base_parameters:
              CATALOG: ${var.catalog}
              SCHEMA: ${var.schema}
              VOLUME: ${var.volume}
              BASE_MODEL: ${var.base_model}
            source: WORKSPACE
        - task_key: Model_Fine_Tuning
          depends_on:
            - task_key: Data_Processing
          notebook_task:
            notebook_path: ../notebooks/02 - Fine Tuning Model.py
            base_parameters:
              CATALOG: ${var.catalog}
              SCHEMA: ${var.schema}
              MODEL_NAME: ${var.model_name}
              MODEL_PATH: ${var.model_path}
              BASE_MODEL: ${var.base_model}
            source: WORKSPACE
          environment_key: gpu_environment
          compute:
            hardware_accelerator: GPU_8xH100
        - task_key: Log_Model
          depends_on:
            - task_key: Model_Fine_Tuning
          notebook_task:
            notebook_path: ../notebooks/03 - Log Model.py
            base_parameters:
              CATALOG: ${var.catalog}
              SCHEMA: ${var.schema}
              MODEL_NAME: ${var.model_name}
              MODEL_PATH: ${var.model_path}
              BASE_MODEL: ${var.base_model}
            source: WORKSPACE
          environment_key: gpu_environment
          compute:
            hardware_accelerator: GPU_8xH100
        - task_key: Deploy_Model
          depends_on:
            - task_key: Log_Model
          notebook_task:
            notebook_path: ../notebooks/04 - Model Deployment.py
            base_parameters:
              CATALOG: ${var.catalog}
              SCHEMA: ${var.schema}
              MODEL_NAME: ${var.model_name}
              ENDPOINT_NAME: ${var.endpoint_name}
            source: WORKSPACE
        - task_key: Model_Evaluation
          depends_on:
            - task_key: Deploy_Model
          notebook_task:
            notebook_path: ../notebooks/05 - Model Evaluation.py
            base_parameters:
              CATALOG: ${var.catalog}
              SCHEMA: ${var.schema}
              MODEL_LIST: ${var.model_list}
            source: WORKSPACE
      environments:
        - environment_key: gpu_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
