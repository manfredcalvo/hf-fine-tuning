# yaml-language-server: $schema=bundle_config_schema.json
bundle:
  name: ft-hf

variables:
  catalog:
    default: users
  schema:
    default: manffred_calvosanchez
  endpoint_name:
    default: deepseek_ft_playground_rag
  model_list:
    default: deepseek_ft_playground_rag,databricks-llama-4-maverick
  model_name:
    default: deepseek_rag_chat_model
  model_path:
    default: /Volumes/users/manffred_calvosanchez/hf_models/deep_seek_ft_model_1/
  volume:
    default: datasets
  base_model:
    default: deepseek-ai/DeepSeek-R1-Distill-Llama-8B

include:
  - ./resources/*.yml

targets:
  dev:
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com/
    permissions:
      - level: CAN_RUN
        user_name: manffred.calvosanchez@databricks.com
      - level: CAN_VIEW
        group_name: users
